<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPI Aggregator Playground</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="topbar">
      <h1>openapi-aggregator <span>playground</span></h1>
      <label>Example <select id="examples"></select></label>
      <button id="share" type="button">Copy share link</button>
      <a href="https://github.com/includeamin/openapi-aggregator">GitHub</a>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="consent" class="notice consent" role="alert" hidden>
      <span id="consent-text"></span>
      <button id="allow-fetch" type="button">Allow fetching</button>
    </div>
    <main class="layout">
      <section class="inputs" aria-label="Inputs">
        <h2>Workspace</h2>
        <ul id="files" class="files"></ul>
        <div class="row">
          <button id="add-file" type="button">New file</button>
          <label class="button">Upload<input id="upload" type="file" accept=".yaml,.yml,.json" multiple hidden /></label>
          <button id="import-url" type="button">Import from URL</button>
        </div>
        <div id="file-editor" class="editor"></div>

        <h2>Config <small>openapi-aggregator.yaml</small></h2>
        <div class="row"><button id="copy-config" type="button">Copy config</button></div>
        <div id="config-editor" class="editor"></div>

        <details id="settings">
          <summary>Settings</summary>
          <label class="field">CORS proxy prefix
            <input id="proxy" type="url" placeholder="https://my-proxy.example.com/?url=" />
          </label>
          <p class="hint">Prepended to every fetched URL. Stored only in this browser.</p>
          <h3>Variables</h3>
          <p class="hint">Values for <code>${VAR}</code> in source URLs and headers. Stored only in this browser and never included in share links.</p>
          <div id="variables"></div>
          <button id="add-variable" type="button">Add variable</button>
        </details>
      </section>

      <section class="outputs" aria-label="Output">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="merged" aria-selected="true">Merged spec</button>
          <button role="tab" data-tab="reference" aria-selected="false">API reference</button>
          <button role="tab" data-tab="problems" aria-selected="false">Problems <span id="problem-count"></span></button>
        </div>
        <div class="panel" data-panel="merged">
          <div class="row">
            <button id="copy-output" type="button">Copy</button>
            <button id="download-output" type="button">Download</button>
          </div>
          <pre id="output"></pre>
        </div>
        <div class="panel" data-panel="reference" hidden><div id="reference"></div></div>
        <div class="panel" data-panel="problems" hidden><ul id="problems" class="problems"></ul></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
