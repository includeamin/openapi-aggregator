name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Core builds for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p openapi-aggregator-core --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p openapi-aggregator
      - name: Smoke test
        run: ./target/release/openapi-aggregator --help

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR action/*.sh
      - name: Script tests
        run: bash action/test.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release -p openapi-aggregator

      - name: Self-test, up to date
        id: pass
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: cfg.yaml
          output: expected.yaml
      - name: Assert passed
        env:
          RESULT: ${{ steps.pass.outputs.result }}
        run: test "$RESULT" = passed

      - name: Self-test, stale output (must fail)
        id: stale
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: cfg.yaml
          output: stale.yaml
      - name: Assert stale
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          RESULT: ${{ steps.stale.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          test "$RESULT" = stale

      - name: Self-test, invalid spec (must fail)
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: invalid-cfg.yaml
      - name: Assert invalid
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          RESULT: ${{ steps.invalid.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          test "$RESULT" = invalid

      - name: Self-test, warnings pass by default
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: warn-cfg.yaml
      - name: Self-test, warnings denied (must fail)
        id: denied
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: warn-cfg.yaml
          deny-warnings: 'true'
      - name: Assert denied
        env:
          OUTCOME: ${{ steps.denied.outcome }}
        run: test "$OUTCOME" = failure

      - name: Self-test, write mode
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: cfg.yaml
          output: written.yaml
          mode: write
      - name: Self-test, written file is up to date
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/release/openapi-aggregator
          working-directory: action/fixtures
          config: cfg.yaml
          output: written.yaml

  action-scripts-macos:
    name: Action scripts (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        run: bash action/test.sh

  action-install:
    name: Action install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # No `binary:` here: this exercises the real download and checksum verification
      # against a published release (v0.14.0 is the first one that ships checksums.txt).
      - name: Install from the release and check the fixtures
        id: check
        uses: ./
        with:
          version: v0.14.0
          working-directory: action/fixtures
          config: cfg.yaml
          output: expected.yaml
      - name: Assert passed
        shell: bash
        env:
          RESULT: ${{ steps.check.outputs.result }}
        run: test "$RESULT" = passed
      - name: The installed binary is on PATH
        shell: bash
        run: openapi-aggregator --version

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR .github/scripts/*.sh
      - name: Release decision tests
        run: bash .github/scripts/test-release-flags.sh
      - name: Publish script tests
        run: bash .github/scripts/test-publish-crates.sh
      - name: Dependency-only release skip tests
        run: bash .github/scripts/test-release-skip.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Build the static binary
        run: cargo build --release -p openapi-aggregator --target x86_64-unknown-linux-musl
      - name: Lay out the binary
        run: |
          mkdir -p dist/linux/amd64
          cp target/x86_64-unknown-linux-musl/release/openapi-aggregator dist/linux/amd64/
      - name: Build the image
        run: docker build --platform linux/amd64 -t oa:test .
      - name: Smoke test
        run: |
          docker run --rm oa:test --version
          test "$(docker inspect -f '{{.Config.User}}' oa:test)" = "65532:65532"
          docker run --rm -v "$PWD/action/fixtures:/work:ro" oa:test --check -c cfg.yaml -o expected.yaml
          set +e
          docker run --rm -v "$PWD/action/fixtures:/work:ro" oa:test --check -c cfg.yaml -o stale.yaml
          test $? -eq 2

  web:
    name: Web playground
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
