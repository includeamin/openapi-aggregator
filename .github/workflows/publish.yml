name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features

      - name: Publish openapi-aggregator-core
        run: cargo publish -p openapi-aggregator-core ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # The CLI crate depends on the core crate from the registry, so a dry run
      # cannot resolve it until core has actually been published.
      - name: Wait for the registry index
        if: ${{ !inputs.dry_run }}
        run: sleep 30

      - name: Publish openapi-aggregator
        if: ${{ !inputs.dry_run }}
        run: cargo publish -p openapi-aggregator
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
