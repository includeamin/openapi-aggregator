[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/includeamin/openapi-aggregator"
homepage = "https://includeamin.github.io/openapi-aggregator/"

[workspace.dependencies]
openapi-aggregator-core = { path = "crates/openapi-aggregator-core", version = "0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1"
